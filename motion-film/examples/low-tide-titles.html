/* ===================== tokens: deep sea ink, wet sand, one buoy red ===================== */
:root{--dry:#d9cfbb;--wetsand:#c3b597;--ink:#0f1c23;--inkT:#13212a;--sandT:#e2d9c6;--red:#a63c27;
  --serif:'Newsreader',Georgia,serif;--sans:'Inter Tight',system-ui,sans-serif;--margin:150px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:var(--sans);color:var(--inkT);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--dry);visibility:hidden}
.ready #stage{visibility:visible}
.ch{display:inline-block}
.num{font-variant-numeric:tabular-nums}
/* ---------- player UI (outside the stage) ---------- */
#ui{position:fixed;inset:0;pointer-events:none;font:15px system-ui,sans-serif;color:#fff;z-index:10}
.rec #ui{display:none}
#start{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);pointer-events:auto;cursor:pointer;transition:opacity .4s}
#start.gone{opacity:0;pointer-events:none}
#start b{width:96px;height:96px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:34px;padding-left:6px}
#start em{font-style:normal;font-size:24px;font-weight:600}
#start small{opacity:.8}
#bar{position:absolute;left:24px;right:24px;bottom:18px;height:22px;display:flex;align-items:center;pointer-events:auto;cursor:pointer;opacity:0;transition:opacity .3s}
.started #bar{opacity:1} .started.idle #bar{opacity:0} .idle{cursor:none}
#bar div{position:relative;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
#bar i{position:absolute;left:0;top:0;height:100%;border-radius:2px;background:#fff;width:0}

.L{position:absolute;inset:0;overflow:hidden}
#water{position:absolute;left:0;top:0;width:1920px;height:1300px;background:var(--ink)}
#surf{position:absolute;left:0;top:0;width:100%;height:2px;background:rgba(226,217,198,.38)}
#wet{clip-path:inset(1080px 0 0 0)}
.g{position:absolute;inset:0}
/* the world's inks: one set on the shore, one under water */
#dry{--tx:var(--inkT);--tx2:rgba(19,33,42,.78);--ch1:rgba(19,33,42,.15);--ch2:rgba(19,33,42,.30);--rd:var(--red)}
#wet{--tx:rgba(226,217,198,.32);--tx2:rgba(226,217,198,.30);--ch1:rgba(226,217,198,.12);--ch2:rgba(226,217,198,.20);--rd:rgba(180,69,47,.55)}
#dry .big{--ch1:rgba(19,33,42,.62);--ch2:rgba(19,33,42,.92)}
#wet .big{--ch1:rgba(226,217,198,.22);--ch2:rgba(226,217,198,.36)}
#dry .calm{--ch1:rgba(19,33,42,.11);--ch2:rgba(19,33,42,.19)}
#wet .calm{--ch1:rgba(226,217,198,.09);--ch2:rgba(226,217,198,.14)}
/* harbour chart: isobaths, soundings, one buoy, one place name */
.chart{position:absolute;left:0;top:0;width:1920px;height:1080px}
.chart path{fill:none;stroke:var(--ch1);stroke-width:var(--sw,1.2px);vector-effect:non-scaling-stroke;stroke-linecap:round}
.chart .dsh{stroke-dasharray:2 7}
.chart text{fill:var(--ch2);font-family:var(--serif);font-style:italic;font-weight:400;font-size:21px}
.chart .clab{font-size:17px}
.chart .place{font-style:italic;font-weight:400;font-size:20px;letter-spacing:.24em}
.chart .bfl{font-size:4.6px}
.chart .can{fill:var(--rd);stroke:none}
.chart .cb{stroke:var(--ch2)}
/* credits: role in tracked caps on the shore, the name surfaces from the water */
.cr{position:absolute;left:var(--margin);top:0;white-space:nowrap}
.rl{position:absolute;left:0;top:0;font-family:var(--sans);font-weight:500;font-size:22px;line-height:1;letter-spacing:.18em;text-transform:uppercase;color:var(--tx);white-space:nowrap}
.nm{position:absolute;left:0;top:0;font-family:var(--serif);font-weight:300;font-size:124px;line-height:1;letter-spacing:-.012em;color:var(--tx);white-space:nowrap}
.nm em{font-style:italic}
.ttl{position:absolute;left:var(--margin);top:0;font-family:var(--serif);font-weight:300;font-size:380px;line-height:1;letter-spacing:-.028em;color:var(--tx);white-space:nowrap;transform-origin:0 100%}
.ep{position:absolute;left:var(--margin);top:0;white-space:nowrap;color:var(--tx)}
.ep .rl{position:static;display:inline-block}
.ep .rule{display:inline-block;width:56px;height:2px;background:currentColor;opacity:.5;margin:0 26px;vertical-align:.32em}
.ep .it{font-family:var(--serif);font-style:italic;font-weight:300;font-size:68px;line-height:1;letter-spacing:-.006em}
/* tide staff: decimetre ticks, metre numerals, the reading rides the waterline */
.staff{position:absolute;left:0;top:0;width:1920px;height:1080px}
.staff path{fill:none;stroke:var(--tx2);stroke-width:1.5px}
.staff text{fill:var(--tx2);font-family:var(--sans);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums;text-anchor:end}
.ro{position:absolute;left:1678px;top:0;font-family:var(--sans);font-weight:500;font-size:18px;line-height:1;letter-spacing:.04em;color:var(--tx);white-space:nowrap;font-variant-numeric:tabular-nums}
.ro i{position:absolute;left:-18px;top:23px;width:12px;height:2px;background:currentColor}
.ro .lw{color:var(--rd)}
.eb{position:absolute;right:336px;top:92px;font-family:var(--sans);font-weight:500;font-size:20px;line-height:1;letter-spacing:.18em;text-transform:uppercase;color:var(--tx);white-space:nowrap}
.eb .sep{display:inline-block;width:2px;height:16px;background:currentColor;opacity:.4;margin:0 16px;vertical-align:-2px}
</style>
</head>

</div>

<script>

const fmtT = m => { m = Math.round(m); return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

/* ===================== the world, built once and twinned (shore copy + submerged copy) ===================== */

const LABX = [];
function buildChart(svg) {

    else if (k === 'm') { sound = !sound; if (!sound) SND.stop(); else if (playing) SND.start(cur); }
    else if (k === 'h') { const u = $('#ui'); u.style.visibility = u.style.visibility === 'hidden' ? '' : 'hidden'; }
    else if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });
  if (Q.has('autoplay')) begin();
}
window.duration = DUR; window.stageSize = [SW, SH]; window.poster = POSTER;   // read by verify.py (stage size, thumbnail frame)
window.seek = t => { cur = clamp(+t || 0, 0, DUR); render(cur); return cur; };
window.renderWav = o => AU.renderWav(o);

/* ===================== boot ===================== */
const fontsReady = Promise.all([...document.fonts].map(f => f.load().catch(() => {}))).then(() => document.fonts.ready);   // every embedded face (display, UI, mono, italics) is ready before the first measure()
window.videoReady = fontsReady.then(() => {
  measure();
  cur = Q.has('t') ? clamp(+Q.get('t') || 0, 0, DUR) : REC ? 0 : POSTER;
  render(cur);
  document.body.classList.add('ready'); if (REC) document.body.classList.add('rec'); else bindUI();
  requestAnimationFrame(frame);
  document.fonts.addEventListener('loadingdone', () => { measure(); render(cur); });
  return true;
});
})();
</script>
